<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول — سوبر ويب</title>
    <meta name="description" content="سجّل دخولك في سوبر ويب عشان تستخدم كل أدوات الويب: محلل مواقع، مترجم، وأكتر.">
    <link rel="canonical" href="https://krack.pages.dev/login">
    <meta name="robots" content="noindex, follow">

    <!-- مكتبة Google Identity Services (تُستدعى مرة واحدة فقط) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- ربط ملف CSS -->
        <style>
      /* CSS حرجة مضمّنة: بتمنع ظهور صفحة مكسورة/بلا تنسيق أثناء تحميل style.css بشكل غير-حاجز للعرض */
      html{background:#FAFBFF;}
      body{margin:0;box-sizing:border-box;font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background-color:#FAFBFF;color:#14122B;min-height:100vh;display:flex;flex-direction:column;}
    </style>
    <link rel="preload" href="/style.min.css" as="style" onload="this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="/style.min.css"></noscript>
</head>
<body>

    <main class="login-container">
        <section class="login-card">
            
            <!-- رأس الصفحة -->
            <header class="login-header">
                <h1>تسجيل الدخول</h1>
                <p>مرحباً بعودتك! أدخل بياناتك للوصول إلى حسابك</p>
            </header>

            <!-- خيار التسجيل عبر جوجل الرسمي -->
            <div class="social-login">
                <div id="g_id_onload"
                     data-client_id="205809787174-a73p118a4mmkpn6cju1dnqcm07eut7v4.apps.googleusercontent.com"
                     data-context="signin"
                     data-ux_mode="popup"
                     data-callback="handleGoogleLogin"
                     data-close_on_tap_outside="false"
                     data-itp_support="true">
                </div>

                <div class="g_id_signin"
                     data-type="standard"
                     data-shape="pill"
                     data-theme="outline"
                     data-text="continue_with"
                     data-size="large"
                     data-logo_alignment="left">
                </div>
            </div>

            <!-- فاصل -->
            <div class="divider">
                <span>أو</span>
            </div>

            <!-- نموذج التسجيل العادي -->
            <form id="login-form" action="#" method="POST" novalidate>
                
                <div class="form-group">
                    <label for="email">البريد الإلكتروني</label>
                    <input type="email" id="email" name="email" placeholder="name@example.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                </div>

                <div class="form-actions">
                    <label class="remember-me">
                        <input type="checkbox" id="remember" name="remember">
                        <span>تذكرني</span>
                    </label>
                    <a href="/forgot-password.html" class="forgot-password">نسيت كلمة المرور؟</a>
                </div>

                <button type="submit" class="btn-primary" id="submit-btn">تسجيل الدخول</button>

            </form>

            <!-- أسفل الكارت -->
            <footer class="login-footer">
                <p>ليس لديك حساب؟ <a href="/register.html">إنشاء حساب جديد</a></p>
                <p>بتسجيل الدخول، إنت موافق على <a href="/terms.html">الشروط والأحكام</a> و<a href="/privacy.html">سياسة الخصوصية</a>.</p>
            </footer>

        </section>
    </main>

    <!-- ربط ملف الـ JavaScript المنفصل -->
    <script src="/script.js" defer></script>

</body>
</html>
