<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استعادة كلمة المرور — سوبر ويب</title>
    <meta name="description" content="استرجع الوصول لحسابك في سوبر ويب.">
    <link rel="canonical" href="https://krack.pages.dev/forgot-password">
    <meta name="robots" content="noindex, follow">

    <!-- مكتبة Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

        <style>
      /* CSS حرجة مضمّنة: بتمنع ظهور صفحة مكسورة/بلا تنسيق أثناء تحميل style.css بشكل غير-حاجز للعرض */
      html{background:#FAFBFF;}
      body{margin:0;box-sizing:border-box;font-family:'Inter',system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background-color:#FAFBFF;color:#14122B;min-height:100vh;display:flex;flex-direction:column;}
    </style>
    <link rel="preload" href="/style.min.css" as="style" onload="this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="/style.min.css"></noscript>
</head>
<body>

    <main class="login-container">
        <section class="login-card">

            <header class="login-header">
                <h1>نسيت كلمة المرور؟</h1>
                <p>
                    مفيش عندنا حالياً نظام لإعادة تعيين كلمة المرور عن طريق الإيميل.
                    لو كنت سجّلت قبل كده بنفس البريد الإلكتروني، تقدر ببساطة تسجّل الدخول
                    بحساب جوجل بنفس الإيميل ده، وهيدخّلك على نفس حسابك القديم تلقائياً.
                </p>
            </header>

            <div class="social-login">
                <div id="g_id_onload"
                     data-client_id="205809787174-a73p118a4mmkpn6cju1dnqcm07eut7v4.apps.googleusercontent.com"
                     data-context="signin"
                     data-ux_mode="popup"
                     data-callback="handleGoogleLogin"
                     data-close_on_tap_outside="false"
                     data-itp_support="true">
                </div>

                <div class="g_id_signin"
                     data-type="standard"
                     data-shape="pill"
                     data-theme="outline"
                     data-text="continue_with"
                     data-size="large"
                     data-logo_alignment="left">
                </div>
            </div>

            <footer class="login-footer">
                <p><a href="/login.html">رجوع لتسجيل الدخول</a></p>
                <p><a href="/privacy.html">سياسة الخصوصية</a> · <a href="/terms.html">الشروط والأحكام</a></p>
            </footer>

        </section>
    </main>

    <script src="/script.js" defer></script>

</body>
</html>
